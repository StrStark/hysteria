name: fleet-spoof-build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Build linux/amd64
        run: |
          cd app
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../hysteria-linux-amd64 ./
          cd ..
          sha256sum hysteria-linux-amd64 | tee hysteria-linux-amd64.sha256
          ls -la hysteria-linux-amd64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete spoof-build --yes --cleanup-tag 2>/dev/null || true
          gh release create spoof-build \
            hysteria-linux-amd64 hysteria-linux-amd64.sha256 \
            --target fleet-spoof \
            --title "Fleet spoof build" \
            --notes "Patched Hysteria 2 with the forged-source ICMP transport (extras/spoofpc)."
